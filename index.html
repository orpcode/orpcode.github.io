<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrpCode</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-size: clamp(2.8rem, 11vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #16a34a;
    }

    /* simple solid dark grey divider */
    .divider {
      width: 80px;
      height: 4px;
      background: #374151;
      border-radius: 2px;
    }

    p {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: #374151;
      letter-spacing: 0.05em;
      max-width: 420px;
      line-height: 1.6;
    }

    p span {
      color: #16a34a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>OrpCode</h1>
    <div class="divider"></div>
    <p>Simple code. <span>Clean results.</span></p>
  </main>
</body>
</html>
